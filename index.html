<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Hell Let Loose Guides by Erich</title>

  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">

  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      background: #181818;
      border-bottom: 1px solid #333;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 10px 0 0;
      color: #bbb;
      font-size: 16px;
    }

    main {
      width: min(1000px, calc(100% - 40px));
      margin: 40px auto;
      flex: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      display: block;
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 22px;
      color: #eee;
      text-decoration: none;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #777;
      background: #222;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .card p {
      margin: 0;
      color: #bbb;
      line-height: 1.45;
    }

    .coming-soon {
      opacity: 0.55;
      cursor: default;
    }

    .coming-soon:hover {
      transform: none;
      border-color: #333;
      background: #1b1b1b;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 24px 20px;
      border-top: 1px solid #222;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>Hell Let Loose Guides</h1>
  <p>Seeding, map resources, and gameplay guides by Erich.</p>
</header>

<main>
  <div class="grid">
    <a class="card" href="./seeding-maps/">
      <h2>Seeding Spawn Maps</h2>
      <p>
        Interactive Hell Let Loose seeding maps with clickable garrison and outpost locations.
      </p>
    </a>

    <div class="card coming-soon">
      <h2>Commander Guides</h2>
      <p>
        Coming soon.
      </p>
    </div>

    <div class="card coming-soon">
      <h2>Squad Leader Guides</h2>
      <p>
        Coming soon.
      </p>
    </div>

    <div class="card coming-soon">
      <h2>Map Callouts</h2>
      <p>
        Coming soon.
      </p>
    </div>
  </div>
</main>

<footer>
  guidesbyerich.fyi
</footer>

</body>
</html>
