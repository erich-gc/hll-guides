  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #111;
    }

    .leaflet-popup-content {
      width: 320px;
    }

    .popup-title {
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 15px;
    }

    .popup-img {
      width: 100%;
      border-radius: 4px;
      display: block;
    }

    .popup-note {
      margin-top: 6px;
      font-size: 13px;
      color: #000000;
    }

    .control-panel {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 999;
      background: rgba(20, 20, 20, 0.9);
      color: white;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      min-width: 180px;
    }

    .control-panel label {
      display: block;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .control-panel select {
      width: 100%;
      margin-top: 4px;
      margin-bottom: 10px;
      padding: 4px;
      background: #222;
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
    }

    .home-link {
      position: absolute;
      top: 12px;
      left: 50px;
      z-index: 999;
      background: rgba(20, 20, 20, 0.9);
      color: white;
      padding: 8px 10px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
    }

    .home-link:hover {
      background: rgba(45, 45, 45, 0.95);
    }
  </style>

  </label>

  <label>

  </label>

  <label>

  <label>

  let currentImageLayer = null;
  let currentMapKey = null;
  const markerLayers = [];

  function getIcon(markerData) {
    if (markerData.team === 'blue' && markerData.type === 'garrison') {
      return icons.blueGarrison;
    }

    if (markerData.team === 'red' && markerData.type === 'garrison') {
      return icons.redGarrison;
    }

    if (markerData.team === 'blue' && markerData.type === 'op') {
      return icons.blueOp;
    }

    if (markerData.team === 'red' && markerData.type === 'op') {
      return icons.redOp;
    }
  }

  function createPopup(markerData) {
    return `
      <div class="popup-title">${markerData.name}</div>
      <img class="popup-img" src="${markerData.image}" alt="${markerData.name}">
      <div class="popup-note">${markerData.note || ''}</div>
    `;
  }

  function clearMarkers() {
    markerLayers.forEach(marker => {
      map.removeLayer(marker);
    });

    markerLayers.length = 0;
  }

  function addMarkersForMap(mapKey) {
    const selectedMap = mapConfigs[mapKey];

    selectedMap.markers.forEach(data => {
      const marker = L.marker([data.y, data.x], {
        icon: getIcon(data)
      }).bindPopup(createPopup(data));

      marker.data = data;
      marker.addTo(map);
      markerLayers.push(marker);
    });

    applyFilters();
  }

  function loadMap(mapKey) {
    const selectedMap = mapConfigs[mapKey];

    currentMapKey = mapKey;

    map.closePopup();

    clearMarkers();

    if (currentImageLayer) {
      map.removeLayer(currentImageLayer);
    }

    const bounds = [
      [0, 0],
      [selectedMap.height, selectedMap.width]
    ];

    currentImageLayer = L.imageOverlay(selectedMap.image, bounds).addTo(map);

    map.fitBounds(bounds);

    addMarkersForMap(mapKey);
  }

  function applyFilters() {
    const showBlue = document.getElementById('showBlue').checked;
    const showRed = document.getElementById('showRed').checked;
    const showGarrisons = document.getElementById('showGarrisons').checked;
    const showOps = document.getElementById('showOps').checked;

    markerLayers.forEach(marker => {
      const data = marker.data;

      let visible = true;

      if (data.team === 'blue' && !showBlue) visible = false;
      if (data.team === 'red' && !showRed) visible = false;
      if (data.type === 'garrison' && !showGarrisons) visible = false;
      if (data.type === 'op' && !showOps) visible = false;

      if (visible) {
        marker.addTo(map);
      } else {
        map.removeLayer(marker);
      }
    });
  }

  function populateMapSelect() {
    const mapSelect = document.getElementById('mapSelect');

    Object.keys(mapConfigs).forEach(mapKey => {
      const option = document.createElement('option');
      option.value = mapKey;
      option.textContent = mapConfigs[mapKey].name;
      mapSelect.appendChild(option);
    });

    mapSelect.addEventListener('change', function() {
      loadMap(this.value);
    });
  }

  document.getElementById('showBlue').addEventListener('change', applyFilters);
  document.getElementById('showRed').addEventListener('change', applyFilters);
  document.getElementById('showGarrisons').addEventListener('change', applyFilters);
  document.getElementById('showOps').addEventListener('change', applyFilters);

  populateMapSelect();
